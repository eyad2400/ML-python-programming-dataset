<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تطبيق إدارة شئون الإدارة العامة للمساعدات الفنية</title>
  <style>
    :root {
      --bg: #081226;
      --card: #0f1f3d;
      --card-soft: #132a52;
      --primary: #39d0ff;
      --secondary: #8be38c;
      --danger: #ff6b77;
      --text: #e8f0ff;
      --muted: #99aacd;
      --shadow: 0 10px 30px rgba(3, 12, 30, 0.45);
      --radius: 18px;
    }
    * { box-sizing: border-box; font-family: "Cairo", "Segoe UI", sans-serif; }
    body {
      margin: 0;
      background: radial-gradient(circle at top right, #12366f 0%, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
    }
    .container { width: min(1200px, 95vw); margin: 18px auto 28px; }
    .panel {
      background: linear-gradient(160deg, rgba(18, 41, 79, 0.95), rgba(9, 22, 45, 0.95));
      border: 1px solid rgba(130, 171, 245, 0.2);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .header { padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display:flex; align-items:center; gap:14px; }
    .brand img { width: 56px; height:56px; border-radius: 14px; background:#0a1731; padding:5px; }
    .title { margin:0; font-size: clamp(1.2rem, 1.8vw, 1.8rem); }
    .sub { margin:4px 0 0; color: var(--muted); font-size: .95rem; }
    .chip { background: rgba(57,208,255,.16); border:1px solid rgba(57,208,255,.45); border-radius: 999px; padding:4px 10px; font-size: .82rem; }
    .layout { margin-top: 14px; display:grid; grid-template-columns: 320px 1fr; gap: 14px; }

    .login-card, .admin-card, .apps-card { padding: 16px; }
    form { display:grid; gap:10px; }
    label { font-weight:600; font-size:.92rem; }
    input, select {
      width:100%; border-radius:10px; border:1px solid rgba(153,170,205,.3);
      background:#0a1731; color:var(--text); padding:10px 12px;
    }
    button {
      border:none; border-radius:12px; padding:10px 14px; cursor:pointer; font-weight:700;
      color:#001329; background:linear-gradient(90deg, var(--primary), #9beaff);
    }
    button.secondary { background:linear-gradient(90deg, #8be38c, #bdf2bc); }
    button.danger { color:#fff; background:linear-gradient(90deg, #ff5f72, #ff8a97); }
    .status { min-height:22px; color: var(--muted); font-size:.92rem; }

    .progress-track { height:14px; border-radius:999px; background:#0a1731; border:1px solid rgba(143,187,255,.25); overflow:hidden; margin-top:8px; }
    .progress-bar { height:100%; width:0; background: linear-gradient(90deg, #8be38c, #39d0ff); transition: width .2s linear; }
    .log { margin-top:10px; max-height:150px; overflow:auto; padding:10px; border-radius:10px; border:1px solid rgba(143,187,255,.2); background:#071327; font-size:.82rem; }

    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .tab { color:var(--text); background:#11254a; border:1px solid rgba(153,170,205,.3); }
    .tab.active { color:#001329; background:linear-gradient(90deg,var(--secondary),#bdf2bc); }
    .workspace { min-height:66vh; border:1px solid rgba(153,170,205,.25); border-radius:14px; overflow:hidden; background:#071327; }
    iframe { width:100%; min-height:66vh; border:0; display:none; background:#fff; }
    iframe.active { display:block; }

    .admin-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    table { width:100%; border-collapse: collapse; font-size: .9rem; }
    th, td { border-bottom: 1px solid rgba(153,170,205,.2); padding:7px; text-align:right; }

    .hidden { display:none !important; }
    @media (max-width: 990px) { .layout { grid-template-columns: 1fr; } .admin-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <header class="panel header">
      <div class="brand">
        <img src="logo.svg" alt="شعار التطبيق" />
        <div>
          <h1 class="title">تطبيق إدارة شئون الإدارة العامة للمساعدات الفنية</h1>
          <p class="sub">نظام موحّد يشمل: Roster + VDA (Vehicle) + HRMS + إدارة الصلاحيات</p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span id="roleChip" class="chip">غير مسجل</span>
        <button id="logoutBtn" class="danger hidden" type="button">خروج</button>
      </div>
    </header>

    <div class="layout">
      <aside class="panel login-card">
        <h3 style="margin-top:0">تسجيل دخول موحد</h3>
        <form id="loginForm">
          <label for="identifier">اسم المستخدم أو البريد المؤسسي</label>
          <input id="identifier" required placeholder="username أو name@corp.com" />
          <label for="password">كلمة المرور</label>
          <input id="password" type="password" required />
          <button type="submit">دخول</button>
        </form>
        <div id="authStatus" class="status"></div>
        <div id="loaderBox" class="hidden">
          <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
          <div style="margin-top:6px"><strong id="progressPct">0%</strong> <span id="progressText" class="sub"></span></div>
          <div id="progressLog" class="log"></div>
        </div>
      </aside>

      <main class="panel apps-card">
        <div class="tabs" id="tabs"></div>
        <div class="workspace">
          <iframe id="frame-roster" title="roster"></iframe>
          <iframe id="frame-vda" title="vda"></iframe>
          <iframe id="frame-hrms" title="hrms"></iframe>
          <section id="adminPanel" class="admin-card hidden">
            <h3 style="margin-top:0">لوحة الإدارة</h3>
            <p class="sub">تعيين الصلاحيات ومراجعة المستخدمين عبر قاعدة البيانات الخارجية الموحدة.</p>
            <div class="admin-grid">
              <div class="panel" style="padding:12px;">
                <form id="roleForm">
                  <label>بريد المستخدم</label>
                  <input id="targetEmail" type="email" required />
                  <label>الدور</label>
                  <select id="targetRole" required>
                    <option value="viewer">viewer</option>
                    <option value="operator">operator</option>
                    <option value="admin">admin</option>
                  </select>
                  <button type="submit" class="secondary">حفظ الصلاحية</button>
                </form>
              </div>
              <div class="panel" style="padding:12px;">
                <button id="refreshUsers" type="button">تحديث المستخدمين</button>
                <table>
                  <thead><tr><th>البريد</th><th>الدور</th><th>آخر تحديث</th></tr></thead>
                  <tbody id="usersTable"></tbody>
                </table>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script>
    const state = { config: null, token: null, user: null, role: 'viewer' };
    const modules = [
      { id:'roster', name:'Roster', file:'Roster-Codex14.html', role:'operator' },
      { id:'vda', name:'VDA - Vehicle Management', file:'VDA.html', role:'viewer' },
      { id:'hrms', name:'HRMS', file:'HRMS-Codex.html', role:'operator' },
      { id:'admin', name:'Admin Dashboard', role:'admin' }
    ];
    const roleRank = { viewer: 1, operator: 2, admin: 3 };

    function canAccess(r){ return roleRank[state.role] >= roleRank[r]; }
    function setProgress(v, txt){
      const p = Math.max(0, Math.min(100, Math.round(v)));
      document.getElementById('progressBar').style.width = `${p}%`;
      document.getElementById('progressPct').textContent = `${p}%`;
      document.getElementById('progressText').textContent = txt || '';
    }
    function addLog(m){
      const el = document.getElementById('progressLog');
      el.innerHTML += `[${new Date().toLocaleTimeString('ar-EG')}] ${m}<br>`;
      el.scrollTop = el.scrollHeight;
    }

    async function loadConfig(){
      const custom = await fetch('app-config.json', { cache:'no-store' }).catch(() => null);
      if (custom?.ok) return custom.json();
      const fallback = await fetch('app-config.example.json');
      return fallback.json();
    }

    async function login(identifier, password){
      const endpoint = state.config?.backend?.authEndpoint;
      if (!endpoint) throw new Error('يرجى ضبط authEndpoint في app-config.json');
      const r = await fetch(endpoint, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ identifier, password })
      });
      if (!r.ok) throw new Error('فشل تسجيل الدخول. تحقق من اسم المستخدم/البريد وكلمة المرور.');
      return r.json();
    }

    async function fetchAuth(url, options = {}){
      const r = await fetch(url, {
        ...options,
        headers: { 'Content-Type':'application/json', ...(options.headers||{}), Authorization: `Bearer ${state.token}` }
      });
      if (!r.ok) throw new Error(await r.text() || `HTTP ${r.status}`);
      return r.json();
    }

    async function streamLoad(path){
      const r = await fetch(path);
      const reader = r.body?.getReader();
      if (!reader) return;
      const total = Number(r.headers.get('Content-Length') || 0);
      let loaded = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        loaded += value.length;
        if (total) addLog(`↳ ${path}: ${Math.round((loaded/total)*100)}%`);
      }
    }

    async function bootstrap(){
      document.getElementById('loaderBox').classList.remove('hidden');
      const tasks = [
        { label:'تحميل الإعدادات', w:15, run: async()=>{ state.config = await loadConfig(); } },
        { label:'تحميل Roster', w:15, run: ()=>streamLoad('Roster-Codex14.html') },
        { label:'تحميل VDA Vehicle', w:10, run: ()=>streamLoad('VDA.html') },
        { label:'تحميل HRMS', w:20, run: ()=>streamLoad('HRMS-Codex.html') },
        { label:'تحميل ملف المستخدم', w:20, run: async()=>{
          const me = await fetchAuth(`${state.config.backend.baseUrl}/me`);
          state.user = me; state.role = me.role || 'viewer';
        }},
        { label:'تحميل الصلاحيات', w:20, run: async()=> fetchAuth(`${state.config.backend.baseUrl}/permissions`) }
      ];
      let p=0;
      for (const t of tasks){ addLog(`⏳ ${t.label}`); await t.run(); p+=t.w; setProgress(p, t.label); addLog(`✅ ${t.label}`); }
      setProgress(100, 'جاهز');
    }

    function renderTabs(){
      const tabs = document.getElementById('tabs');
      tabs.innerHTML = '';
      modules.filter(m => canAccess(m.role)).forEach((m, i) => {
        const b = document.createElement('button');
        b.className = 'tab' + (i === 0 ? ' active' : '');
        b.textContent = m.name;
        b.type = 'button';
        b.onclick = () => activateTab(m.id, b);
        tabs.appendChild(b);
      });
      const first = modules.find(m => canAccess(m.role));
      if (first) activateTab(first.id, tabs.querySelector('button'));
      document.getElementById('adminPanel').classList.toggle('hidden', !canAccess('admin'));
      if (canAccess('admin')) loadUsers();
    }

    function activateTab(id, btn){
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (btn) btn.classList.add('active');
      document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
      document.getElementById('adminPanel').classList.add('hidden');

      if (id === 'admin') { document.getElementById('adminPanel').classList.remove('hidden'); return; }
      const m = modules.find(x => x.id === id);
      const frame = document.getElementById(`frame-${id}`);
      if (m && frame) {
        if (!frame.src) frame.src = `${m.file}?token=${encodeURIComponent(state.token || '')}&role=${state.role}`;
        frame.classList.add('active');
      }
    }

    async function loadUsers(){
      const endpoint = state.config?.backend?.usersEndpoint;
      if (!endpoint) return;
      const rows = await fetchAuth(endpoint);
      const tb = document.getElementById('usersTable'); tb.innerHTML = '';
      for (const u of (rows.users || [])) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${u.email}</td><td>${u.role}</td><td>${new Date(u.updated_at).toLocaleString('ar-EG')}</td>`;
        tb.appendChild(tr);
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('authStatus');
      try {
        status.textContent = 'جاري التحقق...';
        if (!state.config) state.config = await loadConfig();
        const identifier = document.getElementById('identifier').value.trim();
        const password = document.getElementById('password').value;
        const result = await login(identifier, password);
        state.token = result.access_token;
        await bootstrap();
        document.getElementById('roleChip').textContent = `Role: ${state.role}`;
        document.getElementById('logoutBtn').classList.remove('hidden');
        status.textContent = `مرحباً ${state.user?.name || state.user?.email || identifier}`;
        renderTabs();
      } catch(err) { status.textContent = err.message; }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      state.token = null; state.user = null; state.role = 'viewer';
      document.getElementById('roleChip').textContent = 'غير مسجل';
      document.getElementById('logoutBtn').classList.add('hidden');
      document.getElementById('tabs').innerHTML = '';
      document.querySelectorAll('iframe').forEach(f => { f.classList.remove('active'); f.src = ''; });
      document.getElementById('adminPanel').classList.add('hidden');
      document.getElementById('authStatus').textContent = 'تم تسجيل الخروج';
    });

    document.getElementById('refreshUsers').addEventListener('click', loadUsers);
    document.getElementById('roleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await fetchAuth(`${state.config.backend.baseUrl}/admin/roles`, {
          method:'POST',
          body: JSON.stringify({ email: document.getElementById('targetEmail').value.trim(), role: document.getElementById('targetRole').value })
        });
        await loadUsers();
        alert('تم حفظ الصلاحية');
      } catch(err) { alert(err.message); }
    });

    loadConfig().then(cfg => state.config = cfg);
  </script>
</body>
</html>
