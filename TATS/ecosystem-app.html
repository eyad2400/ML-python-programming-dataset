<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منظومة المساعدات الفنية الموحدة</title>
  <style>
    :root {
      --brand: #1e40af;
      --brand-dark: #0f172a;
      --accent: #facc15;
      --bg: #f0f9ff;
      --surface: #ffffff;
      --muted-surface: #eef2ff;
      --text: #0f172a;
      --muted: #475569;
      --success: #16a34a;
      --danger: #dc2626;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
      --radius: 16px;
      --app-font: "Arial", "Noto Sans Arabic", "Tahoma", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 60%, #f8fafc 100%);
      color: var(--text);
      font-family: var(--app-font);
    }

    .container { width: min(1360px, 95vw); margin: 16px auto 24px; }
    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid #dbeafe;
      box-shadow: var(--shadow);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--brand-dark), var(--brand));
    }
    .brand { display:flex; align-items:center; gap: 12px; }
    .brand img {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: rgba(255,255,255,.94);
      padding: 4px;
      animation: floatLogo 3.2s ease-in-out infinite;
    }
    @keyframes floatLogo { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-4px);} }
    .title { margin: 0; font-size: clamp(1.15rem, 2vw, 1.6rem); }
    .sub { margin: 4px 0 0; color: #e2e8f0; font-size: .9rem; }

    .chip {
      padding: 6px 11px;
      border-radius: 999px;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,.45);
      background: rgba(15, 23, 42, 0.28);
    }

    .layout { margin-top: 14px; display: grid; grid-template-columns: 340px 1fr; gap: 14px; }
    .login-card, .apps-card, .admin-card { padding: 16px; }

    form { display: grid; gap: 9px; }
    label { font-weight: 700; color: var(--brand-dark); font-size: .92rem; }
    input, select {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-family: var(--app-font);
    }
    input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(30,64,175,.12); }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-family: var(--app-font);
      font-weight: 700;
      background: var(--brand);
      color: #fff;
      transition: .15s ease;
    }
    button:hover { filter: brightness(.96); }
    button.secondary { background: var(--success); }
    button.danger { background: var(--danger); }
    .status { min-height: 21px; color: var(--muted); margin-top: 8px; }

    .progress-track {
      margin-top: 8px;
      height: 11px;
      border-radius: 999px;
      overflow: hidden;
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
    }
    .progress-bar { height: 100%; width: 0; background: linear-gradient(90deg, #16a34a, #1e40af); }
    .log {
      margin-top: 8px;
      max-height: 170px;
      overflow: auto;
      padding: 9px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      font-size: .82rem;
      color: #334155;
    }

    .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
    .tab {
      background: linear-gradient(180deg,#fff,#eef2ff);
      border: 1px solid #c7d2fe;
      color: #1f2937;
      box-shadow: 0 4px 10px rgba(0,0,0,.08);
    }
    .tab.active {
      background: #1e40af;
      color: #fff;
      border-color: #1e40af;
      box-shadow: 0 6px 16px rgba(30,64,175,.2);
    }
    .workspace {
      min-height: 68vh;
      border: 1px solid #dbeafe;
      border-radius: 14px;
      overflow: hidden;
      background: #f8fafc;
    }
    iframe { width:100%; min-height:68vh; border:0; display:none; background:#fff; }
    iframe.active { display:block; }

    .admin-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    table { width:100%; border-collapse: collapse; font-size:.9rem; }
    th, td { padding: 8px; border-bottom:1px solid #e2e8f0; text-align:right; }
    th { background:#eef2ff; }

    .hidden { display:none !important; }
    @media (max-width: 990px) {
      .layout { grid-template-columns: 1fr; }
      .admin-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="panel header">
      <div class="brand">
        <img src="logo.svg" alt="شعار" />
        <div>
          <h1 class="title">منظومة المساعدات الفنية الموحدة</h1>
          <p class="sub">واجهة موحدة لأنظمة: Roster + VDA + HRMS مع مصادقة مركزية ولوحة إدارة</p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span id="roleChip" class="chip">غير مسجل</span>
        <button id="logoutBtn" class="danger hidden" type="button">تسجيل خروج</button>
      </div>
    </header>

    <div class="layout">
      <aside class="panel login-card">
        <h3 style="margin-top:0">تسجيل دخول موحد</h3>
        <form id="loginForm">
          <label for="identifier">اسم المستخدم / البريد المؤسسي</label>
          <input id="identifier" required placeholder="username أو name@corp.com" autocomplete="username" />

          <label for="password">كلمة المرور</label>
          <input id="password" type="password" required autocomplete="current-password" />

          <label for="otp">رمز MFA (اختياري حسب السياسات)</label>
          <input id="otp" placeholder="123456" inputmode="numeric" />

          <button type="submit">دخول آمن</button>
        </form>
        <div id="authStatus" class="status"></div>

        <div id="loaderBox" class="hidden">
          <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
          <div style="margin-top:6px;"><strong id="progressPct">0%</strong> <span id="progressText" class="sub" style="color:var(--muted)"></span></div>
          <div id="progressLog" class="log"></div>
        </div>
      </aside>

      <main class="panel apps-card">
        <div class="tabs" id="tabs"></div>
        <div class="workspace">
          <iframe id="frame-roster" title="Roster"></iframe>
          <iframe id="frame-vda" title="VDA"></iframe>
          <iframe id="frame-hrms" title="HRMS"></iframe>

          <section id="adminPanel" class="admin-card hidden">
            <h3 style="margin:2px 0 10px;">لوحة إدارة الصلاحيات والمستخدمين</h3>
            <div class="admin-grid">
              <div class="panel" style="padding:12px;">
                <form id="roleForm">
                  <label for="targetEmail">البريد المؤسسي</label>
                  <input id="targetEmail" type="email" required placeholder="employee@corp.com" />
                  <label for="targetRole">الدور</label>
                  <select id="targetRole">
                    <option value="viewer">viewer</option>
                    <option value="operator">operator</option>
                    <option value="admin">admin</option>
                  </select>
                  <button type="submit" class="secondary">حفظ الدور</button>
                </form>
              </div>
              <div class="panel" style="padding:12px;">
                <button id="refreshUsers" type="button">تحديث المستخدمين</button>
                <table>
                  <thead><tr><th>البريد</th><th>الدور</th><th>آخر تحديث</th></tr></thead>
                  <tbody id="usersTable"></tbody>
                </table>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script>
    const state = {
      config: null,
      token: null,
      refreshToken: null,
      user: null,
      role: 'viewer',
      timeoutHandle: null
    };

    const modules = [
      { id:'roster', name:'Roster', file:'Roster-Codex14.html', role:'operator' },
      { id:'vda', name:'VDA - Vehicle Management', file:'VDA.html', role:'viewer' },
      { id:'hrms', name:'HRMS', file:'HRMS-Codex.html', role:'operator' },
      { id:'admin', name:'Admin Dashboard', role:'admin' }
    ];
    const roleRank = { viewer: 1, operator: 2, admin: 3 };

    function canAccess(requiredRole){ return roleRank[state.role] >= roleRank[requiredRole]; }
    function setProgress(value, text){
      const p = Math.max(0, Math.min(100, Math.round(value)));
      document.getElementById('progressBar').style.width = `${p}%`;
      document.getElementById('progressPct').textContent = `${p}%`;
      document.getElementById('progressText').textContent = text || '';
    }
    function addLog(message){
      const el = document.getElementById('progressLog');
      el.innerHTML += `[${new Date().toLocaleTimeString('ar-EG')}] ${message}<br>`;
      el.scrollTop = el.scrollHeight;
    }

    async function loadConfig(){
      const custom = await fetch('app-config.json', { cache:'no-store' }).catch(() => null);
      const response = custom?.ok ? custom : await fetch('app-config.example.json');
      const cfg = await response.json();
      if (!cfg.backend?.baseUrl || !cfg.backend?.authEndpoint) {
        throw new Error('الملف app-config.json غير مكتمل: يرجى تحديد baseUrl و authEndpoint.');
      }
      const authEndpoint = cfg.backend.authEndpoint;
      const isRelative = authEndpoint.startsWith('/');
      const isSecureRemote = authEndpoint.startsWith('https://');
      const isLocalDev = authEndpoint.startsWith('http://localhost') || authEndpoint.startsWith('http://127.0.0.1');
      if (!(isRelative || isSecureRemote || isLocalDev)) {
        throw new Error('نقطة المصادقة يجب أن تكون HTTPS، أو مساراً نسبياً داخل نفس الخادم، أو localhost للتطوير.');
      }
      return cfg;
    }

    async function login(identifier, password, otp){
      const endpoint = state.config.backend.authEndpoint;
      let response;
      try {
        response = await fetch(endpoint, {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ identifier, password, otp })
        });
      } catch (error) {
        throw new Error('تعذر الوصول إلى خادم المصادقة (Failed to fetch). راجع authEndpoint في app-config.json أو شغّل الـ API محلياً.');
      }
      if (!response.ok) throw new Error('فشل تسجيل الدخول. تحقق من بيانات الاعتماد وMFA.');
      return response.json();
    }

    function scheduleSessionTimeout(){
      clearTimeout(state.timeoutHandle);
      const minutes = Number(state.config.security?.sessionTimeoutMinutes || 60);
      state.timeoutHandle = setTimeout(() => {
        doLogout('انتهت الجلسة تلقائياً طبقاً لسياسة الأمان.');
      }, minutes * 60 * 1000);
    }

    async function fetchAuth(url, options = {}){
      const response = await fetch(url, {
        ...options,
        headers: {
          'Content-Type':'application/json',
          ...(options.headers || {}),
          Authorization: `Bearer ${state.token}`
        }
      });
      if (!response.ok) throw new Error(await response.text() || `HTTP ${response.status}`);
      return response.json();
    }

    async function streamLoad(path){
      const response = await fetch(path);
      if (!response.ok) throw new Error(`فشل تحميل ${path}`);
      const reader = response.body?.getReader();
      if (!reader) return;
      const total = Number(response.headers.get('Content-Length') || 0);
      let loaded = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        loaded += value.length;
        if (total) addLog(`↳ ${path}: ${Math.round((loaded / total) * 100)}%`);
      }
    }

    async function bootstrap(){
      document.getElementById('loaderBox').classList.remove('hidden');
      const tasks = [
        { label:'تحميل الإعدادات الأمنية', w:15, run: async()=>{ if (!state.config) state.config = await loadConfig(); } },
        { label:'تحميل Roster', w:15, run: ()=>streamLoad('Roster-Codex14.html') },
        { label:'تحميل VDA Vehicle', w:10, run: ()=>streamLoad('VDA.html') },
        { label:'تحميل HRMS', w:20, run: ()=>streamLoad('HRMS-Codex.html') },
        { label:'قراءة ملف المستخدم', w:20, run: async()=>{
          const me = await fetchAuth(`${state.config.backend.baseUrl}/me`);
          state.user = me;
          state.role = me.role || 'viewer';
        }},
        { label:'تحميل الصلاحيات', w:20, run: async()=>fetchAuth(`${state.config.backend.baseUrl}/permissions`) }
      ];
      let progress = 0;
      for (const task of tasks) {
        addLog(`⏳ ${task.label}`);
        await task.run();
        progress += task.w;
        setProgress(progress, task.label);
        addLog(`✅ ${task.label}`);
      }
      setProgress(100, 'المنظومة جاهزة');
      scheduleSessionTimeout();
    }

    function renderTabs(){
      const tabs = document.getElementById('tabs');
      tabs.innerHTML = '';
      const allowedModules = modules.filter((m) => canAccess(m.role));
      allowedModules.forEach((m, i) => {
        const b = document.createElement('button');
        b.className = 'tab' + (i === 0 ? ' active' : '');
        b.textContent = m.name;
        b.type = 'button';
        b.onclick = () => activateTab(m.id, b);
        tabs.appendChild(b);
      });
      if (allowedModules[0]) activateTab(allowedModules[0].id, tabs.querySelector('button'));
      document.getElementById('adminPanel').classList.toggle('hidden', !canAccess('admin'));
      if (canAccess('admin')) loadUsers();
    }

    function activateTab(id, btn){
      document.querySelectorAll('.tab').forEach((tabBtn) => tabBtn.classList.remove('active'));
      if (btn) btn.classList.add('active');
      document.querySelectorAll('iframe').forEach((f) => f.classList.remove('active'));
      document.getElementById('adminPanel').classList.add('hidden');

      if (id === 'admin') {
        document.getElementById('adminPanel').classList.remove('hidden');
        return;
      }

      const mod = modules.find((m) => m.id === id);
      const frame = document.getElementById(`frame-${id}`);
      if (mod && frame) {
        if (!frame.src) {
          frame.src = `${mod.file}?token=${encodeURIComponent(state.token || '')}&role=${state.role}`;
        }
        frame.classList.add('active');
      }
    }

    async function loadUsers(){
      const endpoint = state.config?.backend?.usersEndpoint;
      if (!endpoint) return;
      const rows = await fetchAuth(endpoint);
      const tb = document.getElementById('usersTable');
      tb.innerHTML = '';
      for (const u of (rows.users || [])) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${u.email}</td><td>${u.role}</td><td>${new Date(u.updated_at).toLocaleString('ar-EG')}</td>`;
        tb.appendChild(tr);
      }
    }

    function doLogout(message = 'تم تسجيل الخروج'){
      clearTimeout(state.timeoutHandle);
      state.token = null;
      state.refreshToken = null;
      state.user = null;
      state.role = 'viewer';
      document.getElementById('roleChip').textContent = 'غير مسجل';
      document.getElementById('logoutBtn').classList.add('hidden');
      document.getElementById('tabs').innerHTML = '';
      document.querySelectorAll('iframe').forEach((f) => { f.classList.remove('active'); f.src = ''; });
      document.getElementById('adminPanel').classList.add('hidden');
      document.getElementById('authStatus').textContent = message;
      setProgress(0, '');
      document.getElementById('progressLog').innerHTML = '';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('authStatus');
      try {
        status.textContent = 'جاري التحقق من الهوية...';
        if (!state.config) state.config = await loadConfig();
        const identifier = document.getElementById('identifier').value.trim();
        const password = document.getElementById('password').value;
        const otp = document.getElementById('otp').value.trim();

        const result = await login(identifier, password, otp || null);
        state.token = result.access_token;
        state.refreshToken = result.refresh_token || null;

        await bootstrap();
        document.getElementById('roleChip').textContent = `Role: ${state.role}`;
        document.getElementById('logoutBtn').classList.remove('hidden');
        status.textContent = `مرحباً ${state.user?.name || state.user?.email || identifier}`;
        renderTabs();
      } catch (err) {
        status.textContent = err.message;
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => doLogout());
    document.getElementById('refreshUsers').addEventListener('click', loadUsers);

    document.getElementById('roleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await fetchAuth(`${state.config.backend.baseUrl}/admin/roles`, {
          method:'POST',
          body: JSON.stringify({
            email: document.getElementById('targetEmail').value.trim(),
            role: document.getElementById('targetRole').value
          })
        });
        await loadUsers();
        alert('تم حفظ الصلاحية.');
      } catch (err) {
        alert(err.message);
      }
    });

    loadConfig().then((cfg) => { state.config = cfg; }).catch((err) => {
      document.getElementById('authStatus').textContent = err.message;
    });
  </script>
</body>
</html>
